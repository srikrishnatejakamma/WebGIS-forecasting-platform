services:
  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    command: server /data --console-address ":9001"
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID:-rivercast}
      MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY:-rivercast-local-secret}
    volumes:
      - object-data:/data
    ports:
      - "9000:9000"
      - "9001:9001"

  app:
    environment:
      OBJECT_STORAGE_ENDPOINT: http://minio:9000
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-rivercast}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-rivercast-local-secret}
    depends_on:
      minio:
        condition: service_started

volumes:
  object-data:
