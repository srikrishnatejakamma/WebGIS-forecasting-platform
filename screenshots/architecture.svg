<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="600" viewBox="0 0 1280 600" role="img" aria-labelledby="title desc">
  <title id="title">RiverCast system architecture</title>
  <desc id="desc">React and OpenLayers frontend communicates with a FastAPI service, which stores station data in PostGIS and grid assets in MinIO. External weather and map providers supply live layers.</desc>
  <defs>
    <linearGradient id="bg" x2="0" y2="1"><stop stop-color="#f6faf8"/><stop offset="1" stop-color="#eaf3f0"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#183d36" flood-opacity=".10"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#4b8073"/></marker>
    <style>
      text{font-family:Inter,Segoe UI,Arial,sans-serif;fill:#173a34}.title{font-size:28px;font-weight:700}.sub{font-size:15px;fill:#607972}.head{font-size:18px;font-weight:700}.body{font-size:14px;fill:#4f6963}.tag{font-size:12px;font-weight:700;letter-spacing:1px;fill:#478072}.line{fill:none;stroke:#4b8073;stroke-width:3;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1280" height="600" rx="24" fill="url(#bg)"/>
  <text x="64" y="68" class="title">RiverCast system architecture</text>
  <text x="64" y="98" class="sub">A local WebGIS for river observations, forecasts, and gridded data</text>
  <rect x="54" y="148" width="1172" height="384" rx="22" fill="#fff" fill-opacity=".55" stroke="#d8e8e2"/>
  <text x="82" y="184" class="tag">LOCAL DOCKER COMPOSE STACK</text>
  <g filter="url(#shadow)">
    <rect x="94" y="230" width="260" height="210" rx="18" fill="#fff" stroke="#cfe2da" stroke-width="2"/>
    <rect x="484" y="230" width="280" height="210" rx="18" fill="#fff" stroke="#cfe2da" stroke-width="2"/>
    <rect x="904" y="210" width="270" height="130" rx="18" fill="#fff" stroke="#cfe2da" stroke-width="2"/>
    <rect x="904" y="370" width="270" height="130" rx="18" fill="#fff" stroke="#cfe2da" stroke-width="2"/>
  </g>
  <text x="122" y="274" class="head">Web interface</text>
  <text x="122" y="309" class="body">React · OpenLayers</text>
  <text x="122" y="336" class="body">Interactive map and charts</text>
  <text x="122" y="363" class="body">Station and data tools</text>
  <text x="122" y="412" class="tag">localhost:3000</text>
  <text x="514" y="274" class="head">API and processing</text>
  <text x="514" y="309" class="body">FastAPI · Forecast scheduler</text>
  <text x="514" y="336" class="body">Imports · Raster conversion · XYZ tiles</text>
  <text x="514" y="363" class="body">Live data integrations</text>
  <text x="514" y="412" class="tag">localhost:8000</text>
  <text x="934" y="252" class="head">PostGIS</text>
  <text x="934" y="282" class="body">Stations · Observations · Forecasts</text>
  <text x="934" y="312" class="tag">localhost:5432</text>
  <text x="934" y="412" class="head">MinIO object storage</text>
  <text x="934" y="442" class="body">Original grid files · Generated COGs</text>
  <text x="934" y="472" class="tag">localhost:9000 · console:9001</text>
  <path d="M354 333H473" class="line"/>
  <text x="374" y="317" class="body">HTTP / JSON</text>
  <path d="M764 286H893" class="line"/>
  <path d="M764 386H893" class="line"/>
  <path d="M354 400C390 490 770 520 904 438" fill="none" stroke="#91b6aa" stroke-width="2" stroke-dasharray="7 8"/>
  <rect x="94" y="470" width="670" height="34" rx="17" fill="#e5f2ed"/>
  <text x="116" y="493" class="body">External layers: OpenStreetMap · Open-Meteo · RainViewer · GDACS · public gauges</text>
</svg>
